name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install harness CLIs for behavioral tests
        run: npm install -g @github/copilot opencode-ai @earendil-works/pi-coding-agent
      - run: pnpm release-gate
